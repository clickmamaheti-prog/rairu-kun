name: Railway Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete existing Railway projects
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WORKSPACE_ID: b1aeb915-817f-4ebc-91ee-aaa559db8e93
        run: |
          echo "🔍 Mencari project Railway yang ada..."
          PROJECTS=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -d "{\"query\":\"{ workspace(workspaceId: \\\"$WORKSPACE_ID\\\") { projects { edges { node { id name } } } } }\"}" | \
            python3 -c "
import sys, json
d = json.load(sys.stdin)
edges = d['data']['workspace']['projects']['edges']
for e in edges:
    print(e['node']['id'])
" 2>/dev/null || echo "")

          if [ -z "$PROJECTS" ]; then
            echo "✅ Tidak ada project yang perlu dihapus."
          else
            for PID in $PROJECTS; do
              echo "🗑️ Menghapus project $PID..."
              curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "https://backboard.railway.app/graphql/v2" \
                -d "{\"query\":\"mutation { projectDelete(id: \\\"$PID\\\") }\"}" | \
                python3 -c "
import sys, json
d = json.load(sys.stdin)
print('Deleted' if d.get('data', {}).get('projectDelete') else 'Error: ' + str(d))
"
              sleep 5
            done
          fi

      - name: Wait for Railway rate limit
        run: |
          echo "⏳ Menunggu 40 detik (Railway rate limit)..."
          sleep 40

      - name: Create new Railway project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WORKSPACE_ID: b1aeb915-817f-4ebc-91ee-aaa559db8e93
        run: |
          echo "🚀 Membuat project Railway baru..."
          RESULT=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -d "{\"query\":\"mutation { projectCreate(input: { name: \\\"rairu-ollama-vps\\\", defaultEnvironmentName: \\\"production\\\", workspaceId: \\\"$WORKSPACE_ID\\\" }) { id name environments { edges { node { id name } } } } }\"}")

          PROJECT_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['projectCreate']['id'])")
          ENV_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['projectCreate']['environments']['edges'][0]['node']['id'])")

          echo "✅ Project ID: $PROJECT_ID"
          echo "✅ Env ID: $ENV_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "ENV_ID=$ENV_ID" >> $GITHUB_ENV

      - name: Deploy from GitHub to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          sleep 3
          echo "📦 Deploy dari GitHub repo..."
          SERVICE_ID=$(curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -d "{\"query\":\"mutation { githubRepoDeploy(input: { projectId: \\\"$PROJECT_ID\\\", repo: \\\"clickmamaheti-prog/rairu-kun\\\", branch: \\\"main\\\", environmentId: \\\"$ENV_ID\\\" }) }\"}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['githubRepoDeploy'])")

          echo "✅ Service ID: $SERVICE_ID"
          echo "SERVICE_ID=$SERVICE_ID" >> $GITHUB_ENV

      - name: Set environment variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          sleep 3
          echo "⚙️ Set environment variables..."
          curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -d "{\"query\":\"mutation { variableCollectionUpsert(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SERVICE_ID\\\", variables: { NTFY_TOPIC: \\\"rairu-mamaheti\\\", BORE_SERVER: \\\"bore.pub\\\", ROOT_PASS: \\\"craxid\\\", OLLAMA_HOST: \\\"0.0.0.0\\\" } }) }\"}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Vars set:', d['data']['variableCollectionUpsert'])"

          echo ""
          echo "🎉 Deploy selesai! Railway sedang build dari kode terbaru."
          echo "📲 Pantau ntfy.sh/rairu-mamaheti untuk port SSH terbaru."