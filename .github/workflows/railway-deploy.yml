name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway redeploy --service ${{ secrets.RAILWAY_SERVICE_ID }} --environment ${{ secrets.RAILWAY_ENVIRONMENT_ID }} --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Success
        if: success()
        run: >-
          curl -s -X POST "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          -H "Title: DevCulture Deploy Berhasil"
          -H "Priority: high"
          -H "Tags: white_check_mark,rocket"
          -d "Deploy sukses! Commit ${{ github.sha }} by ${{ github.actor }}"

      - name: Notify Failure
        if: failure()
        run: >-
          curl -s -X POST "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          -H "Title: DevCulture Deploy GAGAL"
          -H "Priority: urgent"
          -H "Tags: x,rotating_light"
          -d "Deploy gagal! Cek https://github.com/clickmamaheti-prog/rairu-kun/actions"